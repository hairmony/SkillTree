<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SkillTree viewer</title>
  <style>
    button, input, select, textarea { font-size: inherit; }
    body { font-size: 14px; font-family: sans-serif; margin: 0; background: #f7f7f8; color: #222; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
             padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; }
    main { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }
    #graphbox { flex: 2; background: #fff; border: 1px solid #ddd; border-radius: 8px;
                padding: 12px; overflow: auto; min-height: 200px; }
    #side { flex: 1; max-width: 420px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px;
            padding: 10px 12px; margin-bottom: 10px; }
    .card.locked { opacity: 0.55; }
    .card.mastered { border-color: #2b8a3e; }
    .card p { margin: 6px 0; }
    .card ul { margin: 4px 0 8px; padding-left: 20px; }
    .tag { padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
    .tag.locked { background: #eee; }
    .tag.unlocked { background: #fff3bf; }
    .tag.mastered { background: #b2f2bb; }
    details { margin: 0 20px; }
    summary { cursor: pointer; padding: 10px 0; font-weight: bold; }
    .form { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .form input, .form textarea { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 6px; }
    .form textarea { height: 160px; }
    .form textarea.short { height: 60px; }
    button { padding: 6px 12px; cursor: pointer; }
    #msg { margin-left: 10px; }
    .detail { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
    .detail h4 { margin: 10px 0 4px; text-transform: uppercase; color: #666; }
    .detail .note { color: #888; }
    .detail blockquote { margin: 4px 0; padding-left: 8px; border-left: 3px solid #ddd; color: #555; }
    .pct { color: #666; margin-left: 6px; }
    .quiz { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
    .quiz .q { margin-bottom: 12px; }
    .quiz .opt { display: block; width: 100%; text-align: left; margin: 4px 0; background: #fff;
                 border: 1px solid #ccc; border-radius: 6px; }
    .quiz .opt.right { background: #b2f2bb; border-color: #2b8a3e; }
    .quiz .opt.wrong { background: #ffc9c9; border-color: #c92a2a; }
    .quiz .result { color: #444; margin: 4px 0; }
    .quizopts { margin: 6px 0; }
    .quizopts input { width: 3em; }
    .quiz .opt.picked { background: #d0ebff; border-color: #1c7ed6; }
    .note { color: #888; }
    .tag.kind-required { background: #ffc9c9; }
    .tag.kind-optional { background: #e5dbff; }
  </style>
</head>
<body>
  <header>
    <b>SkillTree</b>
    <select id="trees"></select>
    <button id="reset">Reset progress</button>
    <button id="del">Delete tree</button>
  </header>

  <details>
    <summary>Create a new tree</summary>
    <div class="form">
      <label>Topic</label>
      <input id="newTopic" placeholder="e.g. Introduction to Discrete Mathematics">
      <label>Description (optional)</label>
      <textarea id="newDesc" class="short" placeholder="e.g. Explain eigenvectors in relation to machine learning"></textarea>
      <label>Sources (optional)</label>
      <input id="newSource" placeholder="e.g. a link or a book title">
      <label>Notes (optional)</label>
      <textarea id="newText"></textarea>
      <button id="gen">Generate Skill Tree</button>
      <span id="msg"></span>
    </div>
  </details>

  <main>
    <div id="graphbox"><div id="graph"></div></div>
    <div id="side"></div>
  </main>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false });

    let TREE = new URLSearchParams(location.search).get("tree") || "demo";
    let counter = 0;

    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function api(path, options) {
      const r = await fetch(path, options);
      if (!r.ok) {
        let msg = String(r.status);
        try {
          const j = await r.json();
          msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
        } catch {}
        throw new Error(msg);
      }
      return r.json();
    }

    const post = (path, body) => api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });

    async function loadTrees() {
      const trees = await api("/trees");
      const sel = document.getElementById("trees");
      sel.innerHTML = trees.map(t =>
        `<option value="${esc(t.id)}">${esc(t.title)} (${esc(t.id)})</option>`).join("");
      if (trees.some(t => t.id === TREE)) sel.value = TREE;
      else if (trees.length) TREE = trees[0].id;
    }

    async function load(data) {
      data ??= await api(`/trees/${encodeURIComponent(TREE)}`);

      let src = "graph TD\n";
      for (const n of data.nodes)
        src += `  n_${n.id}["${n.title.replace(/"/g, "'")}"]:::${n.status}\n`;
      const kindOf = Object.fromEntries(data.nodes.map(n => [n.id, n.kind]));
      for (const e of data.edges)
        src += `  n_${e.parent_id} ${kindOf[e.child_id] === "optional" ? "-.->" : "-->"} n_${e.child_id}\n`;
      src += "  classDef locked fill:#eee,stroke:#bbb,color:#999\n";
      src += "  classDef unlocked fill:#fff3bf,stroke:#f08c00\n";
      src += "  classDef mastered fill:#b2f2bb,stroke:#2b8a3e\n";
      src += "  classDef optional stroke-dasharray:5 5\n";
      src += "  classDef required stroke:#c92a2a,stroke-width:3px\n";
      for (const n of data.nodes)
        if (n.kind === "optional" || n.kind === "required") src += `  class n_${n.id} ${n.kind}\n`;

      const { svg } = await mermaid.render("g" + (counter++), src);
      document.getElementById("graph").innerHTML = svg;

      const order = { unlocked: 0, locked: 1, mastered: 2 };
      const nodes = [...data.nodes].sort((a, b) => order[a.status] - order[b.status]);
      document.getElementById("side").innerHTML = nodes.map(n => `
        <div class="card ${n.status}">
          <b>${esc(n.title)}</b><span class="tag ${n.status}">${n.status}</span>
          ${n.kind === "required" ? `<span class="tag kind-required">review: required</span>` : ""}
          ${n.kind === "optional" ? `<span class="tag kind-optional">optional</span>` : ""}
          <span class="pct">${pct(n.mastery)} confidence</span>
          <p>${esc(n.description)}</p>
          <ul>${n.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul>
          <div>
            ${n.status === "unlocked" ? `
              <button class="master" data-id="${esc(n.id)}">Mark mastered</button>
              <button class="quizbtn" data-id="${esc(n.id)}">Take quiz</button>` : ""}
            ${n.status === "mastered"
              ? `<button class="resultsbtn" data-id="${esc(n.id)}">Quiz results</button>` : ""}
            <button class="more" data-id="${esc(n.id)}">Show details</button>
          </div>
          ${n.status === "unlocked" ? `
            <div class="quizopts">
              Questions <input type="number" id="qn_${esc(n.id)}" min="3" max="6" value="5">
            </div>` : ""}
          <div class="quiz" id="q_${esc(n.id)}" hidden></div>
          <div class="detail" id="d_${esc(n.id)}" hidden></div>
        </div>`).join("");
    }

    const pct = m => Math.round((m ?? 0) * 100) + "%";

    // Tree returned by a submitted quiz; the page re-renders with it on "Continue",
    // so the results stay on screen until then.
    let pendingTree = null;

    async function startQuiz(btn) {
      const id = btn.dataset.id;
      const box = document.getElementById("q_" + id);
      box.hidden = false;
      btn.disabled = true;
      box.innerHTML = "<p class='note'>Local model is writing a quiz. This could take a minute...</p>";
      try {
        const count = Math.min(6, Math.max(3, parseInt(document.getElementById("qn_" + id).value) || 5));
        const quiz = await post(`/trees/${encodeURIComponent(TREE)}/nodes/${encodeURIComponent(id)}/quiz` +
          `?num_questions=${count}`);
        box.dataset.quiz = quiz.quiz_id;
        box.innerHTML = quiz.questions.map((q, i) => `
            <div class="q" data-qid="${q.id}">
              <b>${i + 1}. ${esc(q.text)}</b> <span class="note">(${esc(q.difficulty)})</span>
              ${q.options.map(o => `<button class="opt" data-opt="${esc(o.id)}">
                ${esc(o.id)}) ${esc(o.text)}</button>`).join("")}
              <div class="result" hidden></div>
            </div>`).join("") +
          `<button class="submit">Submit quiz</button> <span class="result submitmsg"></span>`;
      } catch (err) {
        box.innerHTML = `<p class='note'>Failed: ${esc(err.message)}</p>`;
        btn.disabled = false;
      }
    }

    function pick(opt) {
      const q = opt.closest(".q");
      if (q.dataset.locked) return;
      q.querySelectorAll(".opt").forEach(b => b.classList.toggle("picked", b === opt));
      q.dataset.choice = opt.dataset.opt;
    }

    async function submitQuiz(btn) {
      const box = btn.closest(".quiz");
      const qs = [...box.querySelectorAll(".q")];
      const msg = box.querySelector(".submitmsg");
      if (qs.some(q => !q.dataset.choice)) { msg.textContent = "Please answer every question."; return; }
      btn.disabled = true;
      msg.textContent = "Grading...";
      try {
        const answers = Object.fromEntries(qs.map(q => [q.dataset.qid, q.dataset.choice]));
        const r = await post(`/quizzes/${box.dataset.quiz}/submit`, { answers });
        for (const res of r.results) {
          const q = box.querySelector(`.q[data-qid="${res.id}"]`);
          q.dataset.locked = "1";
          q.querySelectorAll(".opt").forEach(b => {
            b.disabled = true;
            if (b.dataset.opt === res.correct_option_id) b.classList.add("right");
            else if (b.dataset.opt === res.chosen) b.classList.add("wrong");
          });
          const out = q.querySelector(".result");
          out.innerHTML = `${res.correct ? "Correct." : "Wrong."} ${esc(res.explanation)}` +
            (res.concept ? `<br><span class="note">Tests: ${esc(res.concept)}</span>` : "");
          out.hidden = false;
        }
        const added = r.added.length
          ? `<br>${r.passed ? "New optional concepts have been added to your tree!" :
              `You scored below ${Math.round(r.pass_score * 100)}%. New required concepts have been added to your tree!`}
             <ul>${r.added.map(a => `<li>${esc(a.title)} (${esc(a.kind)})</li>`).join("")}</ul>`
          : (r.added_error ? `<br>${esc(r.added_error)}` : "");
        btn.remove();
        msg.innerHTML = `Score: <b>${Math.round(r.score * 100)}%</b>
          (${r.results.filter(x => x.correct).length}/${r.results.length}).
          Confidence ${pct(r.mastery)}.${added}
          <br><button class="finish">Continue</button>`;
        pendingTree = r.tree;
      } catch (err) {
        msg.textContent = "Failed: " + err.message;
        btn.disabled = false;
      }
    }

    async function showResults(btn) {
      const box = document.getElementById("q_" + btn.dataset.id);
      if (!box.hidden) { box.hidden = true; btn.textContent = "Quiz results"; return; }
      box.hidden = false;
      btn.textContent = "Hide quiz results";
      try {
        const r = await api(`/trees/${encodeURIComponent(TREE)}/nodes/${encodeURIComponent(btn.dataset.id)}/quiz/results`);
        const right = r.results.filter(x => x.correct).length;
        box.innerHTML = `<p>Score: <b>${Math.round(r.score * 100)}%</b> (${right}/${r.results.length})</p>` +
          r.results.map((q, i) => `
            <div class="q">
              <b>${i + 1}. ${esc(q.text)}</b>
              ${q.options.map(o => `<button class="opt ${o.id === q.correct_option_id ? "right" :
                  o.id === q.chosen ? "wrong" : ""}" disabled>${esc(o.id)}) ${esc(o.text)}</button>`).join("")}
              <div class="result">${q.correct ? "Correct." : "Wrong."} ${esc(q.explanation)}</div>
            </div>`).join("") +
          (r.added.length ? `<p>Added after this quiz:</p>
             <ul>${r.added.map(a => `<li>${esc(a.title)} (${esc(a.kind)})</li>`).join("")}</ul>` : "");
      } catch (err) {
        box.innerHTML = err.message.includes("no quiz")
          ? "<p class='note'>No quiz was taken for this concept.</p>"
          : `<p class='note'>Failed: ${esc(err.message)}</p>`;
      }
    }

    document.getElementById("side").addEventListener("click", async e => {
      const resBtn = e.target.closest(".resultsbtn");
      if (resBtn) return showResults(resBtn);
      const quizBtn = e.target.closest(".quizbtn");
      if (quizBtn) return startQuiz(quizBtn);
      const opt = e.target.closest(".opt");
      if (opt) return pick(opt);
      const sub = e.target.closest(".submit");
      if (sub) return submitQuiz(sub);
      if (e.target.closest(".finish")) {
        const tree = pendingTree;
        pendingTree = null;
        return load(tree ?? undefined);
      }
      const more = e.target.closest(".more");
      if (more) return showDetails(more);
      const btn = e.target.closest(".master");
      if (!btn) return;
      load(await post(`/trees/${encodeURIComponent(TREE)}/nodes/${encodeURIComponent(btn.dataset.id)}/mastered`));
    });

    async function showDetails(btn) {
      const box = document.getElementById("d_" + btn.dataset.id);
      if (!box.hidden) { box.hidden = true; btn.textContent = "Show details"; return; }
      box.hidden = false;
      btn.textContent = "Hide details";
      box.innerHTML = "<p class='note'>Local model is writing this page. This could take a minute...</p>";
      try {
        const c = await api(`/trees/${encodeURIComponent(TREE)}/nodes/${encodeURIComponent(btn.dataset.id)}/content`);
        box.innerHTML = renderContent(c);
      } catch (err) {
        box.innerHTML = `<p class='note'>Failed: ${esc(err.message)}</p>`;
      }
    }

    function link(s) {
      const label = `${esc(s.title || s.source)} (${esc(s.type || "text")})`;
      return s.url
        ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${label}</a>`
        : label;
    }

    function renderContent(c) {
      const paras = c.details.split(/\n+/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
      const examples = c.examples.length
        ? `<h4>Examples</h4><ul>${c.examples.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
           <p class="note">Examples are written by an LLM, double-check them.</p>` : "";
      const sources = c.sources.length
        ? `<h4>Sources</h4><ul>${c.sources.map(s => `<li>${link(s)}</li>`).join("")}</ul>`
        : `<h4>Sources</h4><p class="note">No source recorded for this page.</p>`;
      return paras + examples + sources;
    }

    document.getElementById("reset").onclick = async () =>
      load(await post(`/trees/${encodeURIComponent(TREE)}/reset`));

    document.getElementById("del").onclick = async () => {
      const sel = document.getElementById("trees");
      if (!sel.value) return;
      if (!confirm(`Are you sure you want to delete "${sel.value}" and its stored data?`)) return;
      await api(`/trees/${encodeURIComponent(sel.value)}`, { method: "DELETE" });
      await loadTrees();
      if (sel.options.length) {
        TREE = sel.value;
        await load();
      } else {
        document.getElementById("graph").innerHTML = "<p>No trees yet.</p>";
        document.getElementById("side").innerHTML = "";
      }
    };

    document.getElementById("trees").onchange = e => { TREE = e.target.value; load(); };

    document.getElementById("gen").onclick = async () => {
      const topic = document.getElementById("newTopic").value.trim();
      const text = document.getElementById("newText").value.trim();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("gen");
      if (!topic) { msg.textContent = "Please enter a topic."; return; }

      btn.disabled = true;
      msg.textContent = "Starting...";
      try {
        const source = document.getElementById("newSource").value.trim() || "your material";
        const description = document.getElementById("newDesc").value.trim();
        const { tree_id: id } = await post("/trees/create", { topic, description, text: text || null, source });
        let job;
        do {
          await new Promise(r => setTimeout(r, 2000));
          job = await api(`/trees/${encodeURIComponent(id)}/status`);
          msg.textContent = job.message;
        } while (job.state === "running");
        if (job.state === "done") {
          TREE = id;
          await loadTrees();
          await load();
        }
      } catch (err) {
        msg.textContent = "Failed: " + err.message;
      } finally {
        btn.disabled = false;
      }
    };

    await loadTrees();
    if (document.getElementById("trees").options.length) {
      await load();
    } else {
      document.getElementById("graph").innerHTML = "<p>No trees yet</p>";
    }
  </script>
</body>
</html>
